<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <meta name="color-scheme" content="dark">
  <meta name="theme-color" content="#141a2c">
  <title>Family Wall Display</title>
  <!-- start_url is "./", not "./index.html" — same asset-server redirect hazard
       sw.js's shellPath() note documents for the Child App (§10.2). -->
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="stylesheet" href="css/wall.css">
</head>
<body>
  <div id="app"></div>

  <!-- One shell; views are DOM, not pages (§11). Core layers before the UI
       layers that use them. -->
  <script src="js/pin-core.js"></script>
  <script src="js/store.js"></script>
  <script src="js/api.js"></script>
  <script src="js/setup.js"></script>
  <script src="js/time-core.js"></script>
  <script src="js/events-core.js"></script>
  <script src="js/chores-core.js"></script>
  <script src="js/slots-core.js"></script>
  <script src="js/school-core.js"></script>
  <script src="js/remind-core.js"></script>
  <script src="js/sound.js"></script>
  <script src="js/poll.js"></script>
  <script src="js/day-ui.js"></script>
  <script src="js/complete-ui.js"></script>
  <script src="js/week-ui.js"></script>
  <script src="js/nav-ui.js"></script>
  <script src="js/settings-ui.js"></script>
  <script src="js/app.js"></script>

  <script>
    if ("serviceWorker" in navigator) {
      window.addEventListener("load", function () {
        navigator.serviceWorker.register("sw.js");
      });
    }
  </script>
</body>
</html>
