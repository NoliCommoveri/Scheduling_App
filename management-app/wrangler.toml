name = "homeschool-management"
main = "worker/index.js"
compatibility_date = "2025-04-01"

# Static assets: the existing vanilla-JS app, served as-is. No build step
# (CLAUDE.md §X — "Vanilla JS, no build step" is preserved). `.assetsignore`
# keeps worker/ and this file out of the public bundle.
[assets]
directory = "./"
binding = "ASSETS"
# Everything except /api/* is a static asset; the Worker only owns the API
# (TDS_Slice_D1_Sync_Management_App.md §7). Route-array form needs Wrangler
# 4.20+; safe to delete on an older one, since /api/* matches no asset and
# falls through to the Worker anyway.
run_worker_first = ["/api/*"]

[[d1_databases]]
binding = "DB"
database_name = "scheduling-app"
database_id = "bb58d835-f115-4ae5-a8ad-5653b102957e"

# SYNC_TOKEN is a secret, never a [vars] entry. Set it on the deployed Worker
# under Settings → Variables and Secrets, with type Secret (not Text).
