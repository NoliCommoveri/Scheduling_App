<!DOCTYPE html>
<html lang="en" data-theme="daylight">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="light dark">
  <meta name="theme-color" content="#5a3fc0">
  <title>Daily Plan</title>
  <!-- start_url is "./", not "./index.html": the asset server 307s the second
       onto the first, and a redirect on the launch URL is what sw.js's
       shellPath() note describes as fatal. Keep new installs off it. -->
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="root"></div>

  <!-- App modules, same load order as the inlined build. -->
  <script src="js/date-util.js"></script>
  <script src="js/planner-core.js"></script>
  <script src="js/assignment-core.js"></script>
  <script src="js/completion-core.js"></script>
  <script src="js/deferment-core.js"></script>
  <script src="js/streak-core.js"></script>
  <script src="js/export-core.js"></script>
  <script src="js/wipe-core.js"></script>
  <script src="js/theme-core.js"></script>
  <script src="js/reward-core.js"></script>
  <script src="js/settings-core.js"></script>
  <script src="js/outbox-core.js"></script>
  <script src="js/db.js"></script>
  <script src="js/pairing.js"></script>
  <script src="js/plan-sync.js"></script>
  <script src="js/outbox.js"></script>
  <script src="js/theming.js"></script>
  <script src="js/completion.js"></script>
  <script src="js/deferment.js"></script>
  <script src="js/streak.js"></script>
  <script src="js/export.js"></script>
  <script src="js/wipe.js"></script>
  <script src="js/reward.js"></script>
  <script src="js/settings.js"></script>
  <script src="js/wizard.js"></script>
  <script src="js/planner-ui.js"></script>
  <script src="js/app.js"></script>

  <script>
    if ("serviceWorker" in navigator) {
      window.addEventListener("load", function () {
        navigator.serviceWorker.register("sw.js");
      });
    }
  </script>
</body>
</html>
